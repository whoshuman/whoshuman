services:
  # ─── Infrastructure ───────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ./infrastructure/postgres/.env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    networks:
      - internal

  migrate:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile.dev
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    working_dir: /app
    restart: "no"
    env_file:
      - path: ./apps/auth-service/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - api-gateway
      - realtime-gateway
    networks:
      - internal

  # ─── Frontend ─────────────────────────────────────────────────────

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL-}
    restart: unless-stopped
    networks:
      - internal

  # ─── API Gateway ──────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./apps/api-gateway/src:/app/apps/api-gateway/src
    env_file:
      - path: ./apps/api-gateway/.env
        required: false
    depends_on:
      - nats
    networks:
      - internal

  # ─── Realtime Gateway ─────────────────────────────────────────────

  realtime-gateway:
    build:
      context: .
      dockerfile: apps/realtime-gateway/Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./apps/realtime-gateway/src:/app/apps/realtime-gateway/src
    env_file:
      - path: ./apps/realtime-gateway/.env
        required: false
    depends_on:
      - nats
    networks:
      - internal

  # ─── Microservices ────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./apps/auth-service/src:/app/apps/auth-service/src
    env_file:
      - path: ./apps/auth-service/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - internal

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./apps/user-service/src:/app/apps/user-service/src
    env_file:
      - path: ./apps/user-service/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - internal

  game-service:
    build:
      context: .
      dockerfile: apps/game-service/Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./apps/game-service/src:/app/apps/game-service/src
    env_file:
      - path: ./apps/game-service/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - internal

  matchmaking-service:
    build:
      context: .
      dockerfile: apps/matchmaking-service/Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./apps/matchmaking-service/src:/app/apps/matchmaking-service/src
    env_file:
      - path: ./apps/matchmaking-service/.env
        required: false
    depends_on:
      - nats
    networks:
      - internal

  chat-service:
    build:
      context: .
      dockerfile: apps/chat-service/Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./apps/chat-service/src:/app/apps/chat-service/src
    env_file:
      - path: ./apps/chat-service/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - internal

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./apps/notification-service/src:/app/apps/notification-service/src
    env_file:
      - path: ./apps/notification-service/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    networks:
      - internal

# ─── Volumes & Networks ─────────────────────────────────────────────

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
