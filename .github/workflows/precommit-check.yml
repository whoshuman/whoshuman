name: Precommit check

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  precommit:
    name: Precommit check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El lint es type-aware: necesita los tipos generados de Prisma para no marcar
      # PrismaClient como `any`. Sin este paso, el lint falla con errores no-unsafe-*.
      - name: Generate Prisma Client
        run: pnpm db:generate

      # Los paquetes compartidos compilan a dist/ (gitignored). El lint de los apps
      # necesita esos tipos (@whoshuman/shared-events, etc.) o no resuelve los imports.
      - name: Build shared packages
        run: pnpm --filter "./packages/*" --if-present build

      - name: Run precommit checks
        run: pnpm run check
