server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html NUNCA se cachea: es quien apunta a los bundles con hash, y si el navegador
  # se queda con uno viejo sigue pidiendo assets que ya no existen tras un despliegue.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Bundles de Vite: llevan hash de contenido en el nombre, asi que un cambio genera otro
  # fichero. Se pueden cachear para siempre; "immutable" evita incluso el 304 de validacion.
  location /assets/ {
    # Un solo Cache-Control: "expires" emite el suyo propio y acababan saliendo dos.
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Modelos y sonidos (public/): NO llevan hash, un mismo nombre puede cambiar de contenido
  # al reexportar un GLB. Se cachean con revalidacion por ETag: el navegador conserva el
  # fichero y solo pregunta si cambio, asi que una recarga responde 304 (unos cientos de
  # bytes) en vez de volver a bajar los ~29 MB de modelos.
  location ~* \.(glb|gltf|mp3|ogg|wav)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    access_log off;
  }

  # El mime.types de nginx no conoce .webmanifest y lo serviria como octet-stream.
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
  }

  # Rutas de la SPA. Se listan una a una para que una URL inventada responda 404 de verdad
  # (antes devolvia la portada con 200 y Google la trataba como un "soft 404"). Si se anade
  # una ruta en src/router.tsx, hay que anadirla aqui y en src/shared/usePageMeta.ts.
  location = / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /index.html =404;
  }

  # Publicas e indexables (las mismas que public/sitemap.xml).
  location ~ ^/(about|manual|faq|support|privacy|terms)/?$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /index.html =404;
  }

  # Privadas o de paso: se sirven, pero fuera de los buscadores.
  location ~ ^/(login|register|oauth/callback|lobby|game|profile|friends|status|design-system)/?$ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Robots-Tag "noindex" always;
    try_files /index.html =404;
  }

  # Ficheros estaticos de public/ (favicon, sitemap, modelos...). Lo demas es 404, y la
  # pagina de error es la propia SPA, que pinta su NotFound conservando el codigo 404.
  location / {
    try_files $uri =404;
  }

  error_page 404 /index.html;
}
