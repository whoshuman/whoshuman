<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Who's Human — el mapa movido por el BACK</title>
    <style>
      body { margin: 0; overflow: hidden; background: #9fc7e8; }
      #hud {
        position: fixed; top: 10px; left: 10px; z-index: 10;
        color: #fff; font: 13px/1.5 monospace; background: #000a;
        padding: 10px 12px; border-radius: 6px; white-space: pre; max-width: 60ch;
      }
    </style>
    <!-- ponytail: spike de prueba para ver el back sobre el mapa. NO es el frontend /game real. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">cargando…</div>
    <div id="pos" style="position:fixed;top:10px;right:10px;z-index:10;color:#fff;font:14px/1.4 monospace;background:#000a;padding:8px 12px;border-radius:6px;white-space:pre;">pos…</div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { clone as skeletonClone } from "three/addons/utils/SkeletonUtils.js";
      import { io } from "https://cdn.socket.io/4.8.1/socket.io.esm.min.js";

      const hud = document.getElementById("hud");
      const set = (t) => (hud.textContent = t);
      const posEl = document.getElementById("pos");

      // El token se lee de token.txt (mismo origen), generado por el script de Node.
      let token;
      try {
        const r = await fetch("token.txt", { cache: "no-store" });
        token = (await r.text()).trim();
      } catch (e) { set("No pude leer token.txt — pide que regeneren el token."); throw e; }
      if (!token) { set("token.txt vacío — pide que regeneren el token."); throw new Error("empty token"); }
      const myId = JSON.parse(atob(token.split(".")[1])).sub; // userId del JWT

      // ---------- escena ----------
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x9fc7e8);
      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);
      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
      scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.3));
      const sun = new THREE.DirectionalLight(0xffffff, 1.6);
      sun.position.set(12, 22, 8);
      scene.add(sun);

      // ---------- cámara 3ª persona del hider (detrás, media altura, seguimiento SUAVE) ----------
      const CAM_DIST = 4; // distancia por detrás
      const CAM_HEIGHT = 2.8; // altura (media: ni aérea de seeker, ni pegada)
      const CAM_LOOK_Y = 1; // punto al que mira
      let camYaw = 0; // ángulo de la cámara; persigue tu orientación poco a poco (sin saltos)
      const lerpAngle = (a, b, t) => {
        let d = ((b - a + Math.PI) % (2 * Math.PI)) - Math.PI;
        if (d < -Math.PI) d += 2 * Math.PI;
        return a + d * t;
      };

      // ---------- mapa beta-city, re-centrado en (0,0) [acuerdo con el back] ----------
      const draco = new DRACOLoader();
      draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/libs/draco/");
      const gltf = new GLTFLoader();
      gltf.setDRACOLoader(draco);
      gltf.load("beta-city.glb", (g) => {
        g.scene.position.set(-8.5, 0, -0.3); // offset de centrado (centro nativo del mapa)
        scene.add(g.scene);
      });

      // ---------- un personaje 3D ANIMADO por jugador (modelos de personajes/) ----------
      const CHAR_SCALE = 0.4;
      const clock = new THREE.Clock();
      const loadGltf = (url) => new Promise((res, rej) => gltf.load(url, res, undefined, rej));
      const [mineGltf, otherGltf] = await Promise.all([
        loadGltf("personajes/character-male-a.glb"),   // tú
        loadGltf("personajes/character-female-a.glb")  // los demás
      ]);
      const avatars = new Map();
      function avatarFor(id) {
        let a = avatars.get(id);
        if (!a) {
          const src = id === myId ? mineGltf : otherGltf;
          const model = skeletonClone(src.scene);
          model.scale.setScalar(CHAR_SCALE);
          scene.add(model);
          const mixer = new THREE.AnimationMixer(model);
          const clip = (name) => src.animations.find((c) => c.name === name);
          const idle = mixer.clipAction(clip("idle"));
          const walk = mixer.clipAction(clip("walk"));
          idle.play(); // arranca quieto
          a = { model, mixer, idle, walk, prevX: 0, prevZ: 0, lastMove: 0, walking: false };
          avatars.set(id, a);
        }
        return a;
      }

      // ---------- input WASD → { forward, turn } (control tank) ----------
      const keys = {};
      addEventListener("keydown", (e) => (keys[e.code] = true));
      addEventListener("keyup", (e) => (keys[e.code] = false));
      function inputVec() {
        const forward = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
        const turn = (keys.KeyA ? 1 : 0) - (keys.KeyD ? 1 : 0); // A gira izquierda, D derecha
        return { forward, turn };
      }

      // ---------- socket: sala → partida ----------
      const socket = io("https://localhost", { auth: { token }, transports: ["websocket"] });
      let gameId = null;
      let players = [];
      socket.on("connect", () => set("conectado · entrando a la sala…"));
      socket.on("connect_error", (e) => set("connect_error: " + e.message + "\n¿Aceptaste el certificado de https://localhost?"));
      socket.on("gateway:error", (e) => set("gateway:error: " + e.message));
      socket.on("gateway:ready", () => socket.emit("lobby:join", {}));
      socket.on("lobby:state", (s) => set(`en la sala · ${s.count} jugador(es) · arrancando (min ${s.min})…`));
      socket.on("matchmaking:match-found", (m) => { gameId = m.gameId; socket.emit("game:join", { gameId }); });
      socket.on("game:joined", () => {
        set("EN PARTIDA — W/S avanzar, A/D girar\nEl SERVIDOR calcula tu posición y rotación (control tank).");
        setInterval(() => {
          if (gameId) {
            const { forward, turn } = inputVec();
            socket.emit("game:player-input", { gameId, forward, turn });
          }
        }, 100);
      });
      socket.on("game:state", (s) => (players = s.players));

      // ---------- bucle de render (solo pinta lo que manda el back) ----------
      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        const now = performance.now();
        for (const p of players) {
          const a = avatarFor(p.userId);
          // el server manda a 20fps → interpolamos hacia su última posición cada frame (60fps) para que no vaya a cachos
          const k = 1 - Math.pow(0.001, dt); // suavizado ~independiente del framerate
          a.model.position.x += (p.x - a.model.position.x) * k;
          a.model.position.z += (p.z - a.model.position.z) * k;
          a.model.position.y += (p.y - a.model.position.y) * k; // altura AUTORITATIVA del server (no raycast: así no trepa árboles/tejados)
          a.model.rotation.y = lerpAngle(a.model.rotation.y, p.rotationY, k);
          // ¿se movió respecto al último snapshot? → walk; si lleva quieto >150ms → idle
          if (Math.abs(p.x - a.prevX) + Math.abs(p.z - a.prevZ) > 0.001) {
            a.prevX = p.x;
            a.prevZ = p.z;
            a.lastMove = now;
          }
          const moving = now - a.lastMove < 150;
          if (moving !== a.walking) {
            a.walking = moving;
            (moving ? a.walk : a.idle).reset().fadeIn(0.2).play();
            (moving ? a.idle : a.walk).fadeOut(0.2);
          }
          a.mixer.update(dt);
        }
        const meServer = players.find((p) => p.userId === myId);
        if (meServer) {
          posEl.textContent =
            `x: ${meServer.x.toFixed(2)}\n` +
            `z: ${meServer.z.toFixed(2)}\n` +
            `altura(y): ${meServer.y.toFixed(2)}`;
        }
        const me = avatars.get(myId);
        if (me) {
          // 3ª persona detrás del personaje; el ángulo persigue tu orientación SUAVEMENTE,
          // así al cambiar de dirección la cámara no salta de golpe.
          const p = me.model.position;
          const gy = p.y; // sube la cámara con la altura del server (rampa)
          camYaw = me.model.rotation.y; // sigue el heading directo (ya es suave con el control tank)
          const camX = p.x - Math.sin(camYaw) * CAM_DIST;
          const camZ = p.z - Math.cos(camYaw) * CAM_DIST;
          camera.position.lerp(new THREE.Vector3(camX, gy + CAM_HEIGHT, camZ), 0.15);
          camera.lookAt(p.x, gy + CAM_LOOK_Y, p.z);
        }
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
