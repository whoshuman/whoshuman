<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Who's Human — Jugar (NPCs + control)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #05010a;
        overflow: hidden;
        font-family: monospace;
      }
      #hud {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        color: #ff2dff;
        font-size: 13px;
        text-align: center;
        text-shadow: 0 0 10px #ff2dff;
        pointer-events: none;
        line-height: 1.7;
      }
      #dbg {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #00d4ff;
        font-size: 12px;
        text-shadow: 0 0 8px #00d4ff;
        pointer-events: none;
        line-height: 1.5;
        white-space: pre;
      }
      #start {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(5, 1, 10, 0.85);
        color: #ff2dff;
        cursor: pointer;
        text-shadow: 0 0 20px #ff2dff;
        z-index: 10;
      }
      #start h1 {
        font-size: 26px;
      }
      #start p {
        font-size: 14px;
        color: #00d4ff;
        text-shadow: 0 0 10px #00d4ff;
      }
      #loading {
        font-size: 16px;
        color: #ff2dff;
        text-shadow: 0 0 20px #ff2dff;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      WHO'S HUMAN — MODO JUGADOR<br />
      <b>W A S D</b> mover &nbsp;|&nbsp; <b>Ratón</b> cámara &nbsp;|&nbsp; <b>Shift</b> correr
      &nbsp;|&nbsp; <b>Espacio</b> saltar<br />
      <b>F</b> poseer NPC cercano &nbsp;|&nbsp; <b>V</b> 1ª/3ª persona &nbsp;|&nbsp;
      <b>Rueda</b> zoom &nbsp;|&nbsp; <b>[ ]</b> tamaño &nbsp;|&nbsp; <b>Esc</b> liberar
    </div>
    <div id="dbg"></div>
    <div id="start">
      <div id="loading">Cargando ciudad, personajes y NPCs... 0%</div>
      <h1 style="display: none" id="title">CIUDAD BETA</h1>
      <p style="display: none" id="play">▶ Click para jugar</p>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { clone as skeletonClone } from "three/addons/utils/SkeletonUtils.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      // ===================== CONFIG =====================
      const CITY = "beta-city.glb"; // mapa sin hornear + luz de día en tiempo real
      const MODELS = [
        // modelos que se cargan (variedad)
        "character-male-a",
        "character-female-a",
        "character-male-c",
        "character-female-d",
        "character-male-e",
        "character-female-f"
      ];
      let CHAR_SCALE = 0.4; // tamaño (ajustable con [ ])
      const NPC_COUNT = 8; // cuántos NPCs sueltos por la ciudad
      const GRAVITY = 9.8;
      const JUMP_V = 5;
      const WALK_SPEED = 2;
      const RUN_SPEED = 3;
      const NPC_SPEED = 2; // velocidad de paseo de los NPCs
      const WP_REACH = 1.2; // distancia para dar un waypoint por alcanzado
      // ==================================================

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xaeb7c4); // cielo claro de día
      scene.fog = new THREE.Fog(0xaeb7c4, 400, 1400); // niebla lejana (no oscurece)
      const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 3000);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(devicePixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new OutputPass());

      // LUZ DE DÍA tipo estudio (como el render beta-mapa.png): clara y uniforme,
      // sin zonas oscuras. El mapa va SIN hornear -> estas luces lo iluminan todo.
      scene.add(new THREE.HemisphereLight(0xeaf0ff, 0xc9b79a, 2.2));
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const sun = new THREE.DirectionalLight(0xfff4e6, 2.4);
      sun.position.set(40, 90, 30);
      scene.add(sun);
      const fill = new THREE.DirectionalLight(0xdfe6ff, 0.8);
      fill.position.set(-50, 50, -40);
      scene.add(fill);

      // ---- Carga ----
      const draco = new DRACOLoader();
      draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/libs/draco/");
      const loader = new GLTFLoader();
      loader.setDRACOLoader(draco);

      // Piezas que SÍ son suelo pisable (por nombre dentro del GLB)
      const FLOOR_PAT = /^(road|tile|driveway|path)/i;
      const collidables = [];
      const floorPts = []; // centros (x,z) de cada tile de suelo real
      let cityCenter = new THREE.Vector3();
      let cityMin = new THREE.Vector3(),
        cityMax = new THREE.Vector3();
      const sources = {}; // name -> { scene, animations }

      // ---- Raycast suelo ----
      const down = new THREE.Vector3(0, -1, 0);
      const ray = new THREE.Raycaster();
      function groundHeight(x, z, fromY) {
        ray.set(new THREE.Vector3(x, fromY, z), down);
        ray.far = 600;
        const hits = ray.intersectObjects(collidables, false);
        return hits.length ? hits[0].point.y : null;
      }

      // ============ PERSONAJE (jugador o NPC) ============
      function makeCharacter(srcName) {
        const src = sources[srcName];
        const obj = skeletonClone(src.scene);
        obj.scale.setScalar(CHAR_SCALE);
        obj.traverse((o) => {
          if (o.isMesh) o.frustumCulled = false;
        });
        scene.add(obj);
        const mixer = new THREE.AnimationMixer(obj);
        const actions = {};
        src.animations.forEach((c) => {
          actions[c.name] = mixer.clipAction(c);
        });
        const c = {
          obj,
          mixer,
          actions,
          current: null,
          velY: 0,
          onGround: false,
          isPlayer: false,
          path: [],
          wpIdx: 0,
          waitT: 0
        };
        setAnim(c, "idle");
        return c;
      }

      function setAnim(c, name) {
        if (!c.actions[name] || c.current === c.actions[name]) return;
        const next = c.actions[name];
        next.reset().fadeIn(0.18).play();
        if (c.current) c.current.fadeOut(0.18);
        c.current = next;
      }

      function faceMove(c, dx, dz, dt) {
        const target = Math.atan2(dx, dz);
        let d = target - c.obj.rotation.y;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        c.obj.rotation.y += d * Math.min(1, dt * 12);
      }

      function physics(c, dt) {
        // STEP = altura máxima de escalón que puede subir (bordillos sí, edificios no).
        // El rayo sale solo un poco por encima de los pies: cualquier tejado/pared
        // queda por encima del origen del rayo -> no se detecta -> no se puede trepar.
        const STEP = Math.max(1.0, CHAR_SCALE * 3);
        c.velY -= GRAVITY * dt;
        c.obj.position.y += c.velY * dt;
        const g = groundHeight(c.obj.position.x, c.obj.position.z, c.obj.position.y + STEP);
        if (g !== null && c.obj.position.y <= g + 0.05) {
          c.obj.position.y = g;
          c.velY = 0;
          c.onGround = true;
        } else c.onGround = false;
      }

      // ---- Rutas aleatorias: SIEMPRE sobre un tile de suelo real ----
      // (elegimos el centro de un tile al azar; así nunca caen en el vacío ni
      //  dependen del bbox, que un tile suelto podría falsear)
      function randomGroundPoint() {
        for (let i = 0; i < 10 && floorPts.length; i++) {
          const p = floorPts[(Math.random() * floorPts.length) | 0];
          const y = groundHeight(p.x, p.z, p.y + 5);
          if (y !== null) return new THREE.Vector3(p.x, y, p.z);
        }
        return cityCenter.clone();
      }
      function makePath(n = 4) {
        const p = [];
        for (let i = 0; i < n; i++) p.push(randomGroundPoint());
        return p;
      }

      // ---- IA NPC: seguir su path, parándose a ratos ----
      const _v = new THREE.Vector3();
      function npcUpdate(c, dt) {
        if (c.waitT > 0) {
          c.waitT -= dt;
          setAnim(c, "idle");
          return;
        }
        const wp = c.path[c.wpIdx];
        _v.set(wp.x - c.obj.position.x, 0, wp.z - c.obj.position.z);
        const d = _v.length();
        if (d < WP_REACH) {
          c.wpIdx = (c.wpIdx + 1) % c.path.length;
          if (Math.random() < 0.4) c.waitT = 0.8 + Math.random() * 2.5; // pausa aleatoria
          return;
        }
        _v.normalize();
        c.obj.position.addScaledVector(_v, NPC_SPEED * dt);
        faceMove(c, _v.x, _v.z, dt);
        setAnim(c, "walk");
      }

      // ---- Control del jugador ----
      let yaw = 0,
        pitch = 0.35,
        dist = 4,
        firstPerson = false; // dist = múltiplo del tamaño del personaje
      const keys = {};
      function playerUpdate(c, dt) {
        let f = 0,
          s = 0;
        if (keys["KeyW"]) f += 1;
        if (keys["KeyS"]) f -= 1;
        if (keys["KeyA"]) s -= 1;
        if (keys["KeyD"]) s += 1;
        const running = keys["ShiftLeft"] || keys["ShiftRight"];
        const moving = f !== 0 || s !== 0;
        const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        _v.set(0, 0, 0).addScaledVector(fwd, f).addScaledVector(right, s);
        const speed = running ? RUN_SPEED : WALK_SPEED;
        if (moving) {
          _v.normalize();
          c.obj.position.addScaledVector(_v, speed * dt);
          if (!firstPerson) faceMove(c, _v.x, _v.z, dt);
          else c.obj.rotation.y = yaw;
        } else if (firstPerson) c.obj.rotation.y = yaw;

        if (c.onGround && keys["Space"]) {
          c.velY = JUMP_V;
          c.onGround = false;
        }

        if (!c.onGround && c.velY > 0.5) setAnim(c, "jump");
        else if (!c.onGround && c.velY < -2) setAnim(c, "fall");
        else if (moving) setAnim(c, running ? "sprint" : "walk");
        else setAnim(c, "idle");
      }

      // ============ ESTADO GLOBAL ============
      let characters = [];
      let controlled = null;

      function possess(c) {
        if (controlled) {
          controlled.isPlayer = false;
          controlled.path = makePath();
          controlled.wpIdx = 0;
        }
        controlled = c;
        c.isPlayer = true;
        c.obj.visible = true;
      }
      function possessNearest() {
        let best = null,
          bd = 1e9;
        for (const c of characters) {
          if (c === controlled) continue;
          const d = c.obj.position.distanceTo(controlled.obj.position);
          if (d < bd) {
            bd = d;
            best = c;
          }
        }
        if (best) possess(best);
      }

      // ---- Cámara ----
      const camTarget = new THREE.Vector3();
      function updateCamera() {
        const headY = CHAR_SCALE * 1.6;
        const p = controlled.obj.position;
        if (firstPerson) {
          controlled.obj.visible = false;
          camTarget.set(p.x, p.y + headY, p.z);
          const cp = Math.cos(pitch),
            sp = Math.sin(pitch);
          const look = new THREE.Vector3(-Math.sin(yaw) * cp, sp, -Math.cos(yaw) * cp);
          camera.position.copy(camTarget);
          camera.lookAt(camTarget.clone().add(look));
        } else {
          controlled.obj.visible = true;
          camTarget.set(p.x, p.y + headY, p.z);
          const cp = Math.cos(pitch),
            sp = Math.sin(pitch);
          const D = dist * CHAR_SCALE; // la cámara se aleja en proporción al tamaño
          const offset = new THREE.Vector3(
            Math.sin(yaw) * cp * D,
            sp * D + 0.5 * CHAR_SCALE,
            Math.cos(yaw) * cp * D
          );
          camera.position.copy(camTarget).add(offset);
          camera.lookAt(camTarget);
        }
      }

      // ---- Input ----
      const startEl = document.getElementById("start");
      addEventListener("keydown", (e) => {
        keys[e.code] = true;
        if (["Space", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
        if (e.code === "BracketRight") {
          CHAR_SCALE = Math.min(20, CHAR_SCALE * 1.15);
          rescale();
        }
        if (e.code === "BracketLeft") {
          CHAR_SCALE = Math.max(0.3, CHAR_SCALE / 1.15);
          rescale();
        }
        if (e.code === "KeyF") possessNearest();
        if (e.code === "KeyV") firstPerson = !firstPerson;
      });
      addEventListener("keyup", (e) => (keys[e.code] = false));
      function rescale() {
        for (const c of characters) c.obj.scale.setScalar(CHAR_SCALE);
      }

      function enter() {
        renderer.domElement.requestPointerLock();
      }
      renderer.domElement.addEventListener("click", enter);
      startEl.addEventListener("click", enter); // el cartel ahora SÍ entra al juego
      document.addEventListener("pointerlockchange", () => {
        const locked = document.pointerLockElement === renderer.domElement;
        startEl.style.display = locked ? "none" : "flex";
      });
      document.addEventListener("mousemove", (e) => {
        if (document.pointerLockElement !== renderer.domElement) return;
        yaw -= e.movementX * 0.0025;
        pitch += e.movementY * 0.0025;
        pitch = Math.max(firstPerson ? -1.2 : -0.2, Math.min(1.2, pitch));
      });
      addEventListener(
        "wheel",
        (e) => {
          dist = Math.max(1.5, Math.min(15, dist + e.deltaY * 0.005));
        },
        { passive: true }
      );
      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
      });

      // ---- Bucle ----
      const clock = new THREE.Clock();
      const dbg = document.getElementById("dbg");
      (function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(0.05, clock.getDelta());
        for (const c of characters) {
          if (c === controlled) playerUpdate(c, dt);
          else npcUpdate(c, dt);
          physics(c, dt);
          c.mixer.update(dt);
        }
        if (controlled) updateCamera();
        composer.render();
        const p = controlled ? controlled.obj.position : { x: 0, y: 0, z: 0 };
        dbg.textContent =
          `NPCs: ${characters.length - 1}   escala: ${CHAR_SCALE.toFixed(2)} ([ ])\n` +
          `vista: ${firstPerson ? "1ª persona" : "3ª persona"} (V)\n` +
          `pos: ${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)}\n` +
          `F = poseer el NPC más cercano`;
      })();

      // ============ ARRANQUE ============
      function loadCity() {
        return new Promise((res) => {
          loader.load(
            CITY,
            (gltf) => {
              scene.add(gltf.scene);
              const _c = new THREE.Vector3();
              gltf.scene.traverse((o) => {
                if (o.isMesh) {
                  // SOLO el suelo (calles, aceras, caminos) cuenta como pisable.
                  // Edificios, árboles, props NO -> el personaje nunca se sube a ellos.
                  if (FLOOR_PAT.test(o.name)) {
                    collidables.push(o);
                    new THREE.Box3().setFromObject(o).getCenter(_c);
                    floorPts.push(_c.clone());
                  }
                  const mats = Array.isArray(o.material) ? o.material : [o.material];
                  mats.forEach((m) => {
                    if (m && m.emissive) m.emissiveIntensity = 1.0;
                  });
                }
              });
              const box = new THREE.Box3().setFromObject(gltf.scene);
              box.getCenter(cityCenter);
              cityMin.copy(box.min);
              cityMax.copy(box.max);
              // CENTRO ROBUSTO = mediana de los tiles de suelo (ignora el tile suelto)
              if (floorPts.length) {
                const med = (a) => {
                  const s = [...a].sort((p, q) => p - q);
                  return s[s.length >> 1];
                };
                cityCenter.set(
                  med(floorPts.map((p) => p.x)),
                  med(floorPts.map((p) => p.y)),
                  med(floorPts.map((p) => p.z))
                );
              }
              const span = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
              scene.fog = new THREE.Fog(0xaeb7c4, span * 2.0, span * 6.0);
              res();
            },
            (xhr) => {
              if (xhr.total)
                document.getElementById("loading").textContent =
                  `Cargando ciudad... ${Math.round((xhr.loaded / xhr.total) * 60)}%`;
            }
          );
        });
      }
      function loadModel(name) {
        return new Promise((res) => {
          loader.load(`personajes/${name}.glb`, (gltf) => {
            sources[name] = { scene: gltf.scene, animations: gltf.animations };
            res();
          });
        });
      }

      loadCity()
        .then(() => Promise.all(MODELS.map(loadModel)))
        .then(() => {
          // jugador: aparece sobre un tile de suelo real (cerca del centro)
          const player = makeCharacter(MODELS[0]);
          let sp = cityCenter.clone();
          let gy = groundHeight(sp.x, sp.z, sp.y + 200);
          if (gy === null) {
            sp = randomGroundPoint();
            gy = sp.y;
          }
          player.obj.position.set(sp.x, gy + 0.2, sp.z);
          characters.push(player);
          possess(player);
          // NPCs
          for (let i = 0; i < NPC_COUNT; i++) {
            const c = makeCharacter(MODELS[1 + (i % (MODELS.length - 1))]);
            c.path = makePath(3 + Math.floor(Math.random() * 4));
            c.obj.position.copy(c.path[0]);
            characters.push(c);
          }
          document.getElementById("loading").style.display = "none";
          document.getElementById("title").style.display = "block";
          document.getElementById("play").style.display = "block";
        });
    </script>
  </body>
</html>
