events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Docker asigna IPs nuevas al recrear contenedores. Resolver los nombres de
  # servicio periódicamente evita que Nginx conserve upstreams obsoletos.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:80 resolve;
  }

  upstream api_gateway_upstream {
    zone api_gateway_upstream 64k;
    server api-gateway:3000 resolve;
  }

  upstream realtime_gateway_upstream {
    zone realtime_gateway_upstream 64k;
    server realtime-gateway:3000 resolve;
  }

  # ─── Gzip ─────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1024;

  # ─── Timeouts ─────────────────────────────────────────────────────
  keepalive_timeout 65;
  client_max_body_size 10M;

  # ─── Redirect HTTP → HTTPS ────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ─── HTTPS ────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    # ─── SSL ────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ─── Security headers ───────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ─── Frontend ───────────────────────────────────────────────────
    location / {
      proxy_pass         http://frontend_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
    }

    # ─── REST API ───────────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://api_gateway_upstream/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
    }

    # ─── WebSockets ─────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass             http://realtime_gateway_upstream;
      proxy_http_version     1.1;
      proxy_set_header       Upgrade          $http_upgrade;
      proxy_set_header       Connection       "upgrade";
      proxy_set_header       Host             $host;
      proxy_set_header       X-Forwarded-Proto https;
      proxy_read_timeout     86400;
    }
  }
}
